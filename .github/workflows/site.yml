name: Sync statuses & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Episodes air Wednesdays 8-10pm ET. Check every 30 min from 10pm-2:30am ET (EDT)...
    - cron: "*/30 2-6 * * 4"
    # ...plus every 6 hours as a catch-all for late Wikipedia edits.
    - cron: "15 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull statuses from Wikipedia
        run: python scripts/update_status.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data/castaways.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "probstsposse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/castaways.json
          git commit -m "Update castaway statuses from Wikipedia"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    # Deploy on pushes, manual runs, and scheduled runs that changed data.
    # Bot pushes made with GITHUB_TOKEN don't trigger a new workflow run, so deploy here.
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
       needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js data images _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
