name: Sync statuses & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto: sync once, or keep watching on episode night · watch: keep checking · deploy: just redeploy"
        type: choice
        options: [auto, watch, deploy]
        default: auto
      minutes:
        description: "watch mode only: how many minutes to keep checking"
        default: "180"
  schedule:
    # GitHub starts scheduled runs late (often by hours) and skips many of them, so these
    # are only chances to start. The precise timing lives in scripts/sync.sh: a run that
    # starts on episode night stays alive and re-checks Wikipedia every 5 minutes.
    # Times are UTC. Odd minutes on purpose: the top of the hour is the busiest slot.
    - cron: "23 * * * *"            # baseline: hourly, all week
    - cron: "8,38,53 20-23 * * 3"   # Wednesday 3pm ET onward: extra chances to start the watcher
    - cron: "8,38,53 0-5 * * 4"     # ...through 1am ET (episodes air Wednesdays at 8pm ET)

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  sync:
    if: github.event_name != 'push' && inputs.mode != 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull statuses from Wikipedia
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'auto' }}
          WATCH_MINUTES: ${{ inputs.minutes || '180' }}
        run: bash scripts/sync.sh

  deploy:
    # Pushes deploy directly. When a sync changes the data it commits, then requests a
    # deploy-only run: pushes made with the workflow's own token don't start one themselves.
    if: github.event_name == 'push' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js data images _site/
          touch _site/.nojekyll
          # Bust browser caches so each deploy's CSS/JS loads immediately
          sed -i "s/?v=dev/?v=$(git rev-parse --short HEAD)/g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
